id: nvidia_rtx_video_upscale
status: enabled
api_json_file: data/default_workflows/workflow/nvidia_rtx_video_upscale.json
type: video-upscale
purpose: video upscale requests
output_type: video
command_example: |
  comfyui-scheduler run -w nvidia_rtx_video_upscale -i '{"video_file": "C:/Users/anson/Downloads/wan22_00002.mp4", "magnification": 2.0}'
input_node_mapping:
  magnification:
    description: magnification
    node_input_field: "resize_type.scale"
    node_meta_title: "RTX Video Super Resolution"
    value_type: float
    required: true
  video_file:
    description: Source video that needs to be enlarged
    node_input_field: "file"
    node_meta_title: "LoadVideo"
    value_type: file
    required: true
