id: ominivoice_voice_design
status: enabled
api_json_file: data/default_workflows/workflow/ominivoice_voice_design.json
type: text_to_speech
purpose: Character voice design based on text-to-speech
output_type: audio
command_example: |
  comfyui-scheduler run -w ominivoice_voice_design -i '{"voice_instruct": "男，中年，极低音调", "content": "这不该是兽人的命运"}'
input_node_mapping:
  voice_instruct:
    description: Voice Instruct
    node_input_field: "voice_instruct"
    node_meta_title: "OmniVoice Voice Design TTS"
    value_type: string
    required: true
  speed:
    description: Speed
    node_input_field: "speed"
    node_meta_title: "OmniVoice Voice Design TTS"
    value_type: float
    required: false
  content:
    description: Audio text content
    node_input_field: "text"
    node_meta_title: "OmniVoice Voice Design TTS"
    value_type: string
    required: false
  seed:
    description: Random seed
    node_input_field: "seed"
    node_meta_title: "OmniVoice Voice Design TTS"
    value_type: int
    required: false
