[project]
name = "comfyui-cli"
version = "1.0.0"
description = "Command-line tool for interacting with remote ComfyUI nodes"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "websockets>=12.0",
    "click>=8.0",
]

[project.scripts]
comfyui-cli = "comfyui_cli.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
